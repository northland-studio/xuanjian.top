# =====================================================================
# 玄剑公会子域名反向代理
#   profiles.xuanjian.top -> GMIRS 成员档案查询系统（/gmirs）
#   chufen.xuanjian.top   -> GDARS 成员处分信息查询系统（/gdars）
#
# 说明：
#   xuanjian.top 官网由 Cloudflare 边缘节点终结 HTTPS 后以 HTTP 回源到本机 nginx，
#   故此处仅需 listen 80（Flexible SSL）。Cloudflare 上对应子域名 A 记录需指向本服务器。
#   两个子域名共享同一套 React SPA（xuanjian-guild，localhost:3000），
#   首页 / 分别 308 跳转到 /gmirs 与 /gdars 即可命中对应客户端路由并复用其 API。
# =====================================================================

server {
    listen 80;
    server_name profiles.xuanjian.top;

    access_log /var/log/nginx/profiles.xuanjian.access.log;
    error_log  /var/log/nginx/profiles.xuanjian.error.log;

    # 根路径跳转到 GMIRS 档案查询
    location = / {
        return 308 /gmirs;
    }

    # 带版本 hash 的构建产物：长缓存（与官网主配置一致）
    location /assets/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理（GMIRS / GDARS 均走 /api/gmirs、/api/discipline 等）
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # 上传图（档案头像等若仍走本地上传路径）
    location ^~ /uploads/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SPA：其余一切交给 React 应用（含 /gmirs 路由及其子路径）
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

