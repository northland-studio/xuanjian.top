    listen 80;
    server_name chufen.xuanjian.top;

    access_log /var/log/nginx/chufen.xuanjian.access.log;
    error_log  /var/log/nginx/chufen.xuanjian.error.log;

    # 根路径跳转到 GDARS 处分查询
