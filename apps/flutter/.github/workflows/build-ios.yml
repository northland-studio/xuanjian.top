name: Build Flutter iOS

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/flutter/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/flutter/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (analyze only)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign || true
