<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 我的世界玄剑公会</title>
    <link rel="icon" href="/icon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css?v=2.0.3">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('2.png') center/cover no-repeat;
        }
        .auth-box {
            background: rgba(255, 255, 255, 0.285);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
        }
        .auth-title {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            text-align: center;
            color: #94979a;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #6366f1;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: #6366f1;
        }
        .forgot-link {
            color: #6366f1;
            text-decoration: none;
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .auth-btn:hover {
            background: #4f46e5;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }
        .auth-footer a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #94979a;
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        .qq-login-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #333;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .qq-login-btn:hover {
            background: #f0f0f0;
        }
        .qq-login-btn svg {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-box">
            <div class="auth-logo">
                <img src="/icon.png" alt="玄剑公会">
            </div>
            <h1 class="auth-title">欢迎回来</h1>
            <p class="auth-subtitle">登录您的玄剑公会账号</p>
            
            <div class="error-message" id="error-msg"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-input" id="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="password" placeholder="请输入密码" required>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>记住我</span>
                    </label>
                </div>
                <button type="submit" class="auth-btn">登录</button>
            </form>
            
            <div class="divider">或</div>
            <button class="qq-login-btn" onclick="qqLogin()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#12B7F5">
                    <path d="M21.9 17.5c-.4-1.2-1.2-1.9-2.1-2.6-.6-.5-1.2-.9-1.6-1.4-.1-.1-.2-.3-.2-.5l.1-1.9c.1-1.2-.3-2.4-1.1-3.4-1.4-1.7-3.5-2.4-5.5-2.5h-.5c-2 0-4.1.8-5.5 2.5-.8 1-1.2 2.2-1.1 3.4l.1 1.9c0 .2-.1.4-.2.5-.4.5-1 1-1.6 1.4-.9.7-1.7 1.4-2.1 2.6-.2.6-.3 1.4 0 2 .3.6.9 1 1.6 1 .9 0 1.9-.3 2.8-.6.5-.2 1-.4 1.4-.4.5 0 1 .1 1.5.3.5.3 1 .6 1.5 1 .5.4 1 .9 1.5 1.3.4.3 1.1.3 1.5 0 .5-.4 1-.9 1.5-1.3.5-.4 1-.7 1.5-1 .5-.2 1-.3 1.5-.3.4 0 .9.2 1.4.4.9.3 1.9.6 2.8.6.7 0 1.3-.4 1.6-1 .3-.6.2-1.4 0-2z"/>
                </svg>
                QQ登录
            </button>
            
            <div class="auth-footer">
                还没有账号？<a href="/register">立即注册</a>
                <span style="margin: 0 12px; color: var(--text-secondary);">|</span>
                <a href="/forgot-password" style="color: var(--text-secondary);">忘记密码？</a>
            </div>
        </div>
    </div>

    <script src="/js/common.js?v=2.0.3"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const errorMsg = document.getElementById('error-msg');
            
            try {
                const data = await post('/api/auth/login', {
                    username,
                    password,
                    remember
                });
                
                // 保存登录状态
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                showToast('登录成功', 'success');
                
                // 检查是否有redirect参数
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect');
                
                // 跳转
                setTimeout(() => {
                    if (redirect) {
                        // 保留所有OAuth参数并跳转
                        const clientId = params.get('client_id');
                        const redirectUri = params.get('redirect_uri');
                        const state = params.get('state');
                        
                        let targetUrl = redirect + '?response_type=code';
                        if (clientId) targetUrl += `&client_id=${clientId}`;
                        if (redirectUri) targetUrl += `&redirect_uri=${redirectUri}`;
                        if (state) targetUrl += `&state=${state}`;
                        
                        window.location.href = targetUrl;
                    } else {
                        window.location.href = '/';
                    }
                }, 500);
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
            }
        });
        
        // QQ登录：跳转后端，由后端重定向到心月互联
        function qqLogin() {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || '';
            window.location.href = '/api/auth/qq/login?redirect=' + encodeURIComponent(redirect);
        }
        
        // 显示URL中的错误信息
        (function() {
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');
            if (error) {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.textContent = decodeURIComponent(error);
                errorMsg.style.display = 'block';
                // 清理URL中的错误参数
                params.delete('error');
                const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
                window.history.replaceState({}, '', newUrl);
            }
        })();
    </script>
</body>
</html>
